name: Evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Voice & intent evals (Node)
        run: npm run test:voice

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Backend RAG & dialogue evals (pytest)
        run: pytest tests/evals tests/test_locality_resolver.py -q
